name: Render Notebook & Deploy to Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas numpy scikit-learn matplotlib seaborn xgboost imbalanced-learn jupyter nbconvert

      - name: Execute and convert notebook
        run: |
          mkdir -p docs
          jupyter nbconvert --to html --execute --ExecutePreprocessor.timeout=600 analysis.ipynb --output-dir docs --output index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ github.event.deployment.payload.web_url || '' }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
